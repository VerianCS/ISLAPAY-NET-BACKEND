name: CI

# Every branch and every pull request. A payments backend with tests nobody
# runs is a payments backend without tests.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch, except on master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real broker, because the messaging tests are integration tests on
    # purpose: what is worth checking is that RabbitMQ accepts the topology we
    # declare and routes what we publish, and a mock can only confirm we called
    # our own code. Without this the tests would skip — quietly, which is worse
    # than failing.
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RABBITMQ_HOST: localhost
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    steps:
      - uses: actions/checkout@v4

      # Keycloak cannot be a service container: the image needs a command
      # (`start-dev`), and the `services:` syntax has nowhere to put one. So it
      # is started here, and the job waits for it rather than racing it.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.7 start-dev --http-port 8080

      - name: Wait for Keycloak
        # Bounded twice over. The loop counts attempts, but an attempt that
        # hangs makes the count meaningless — curl's own default connect
        # timeout is minutes, so a socket that is accepted and then never
        # answered stalls the job rather than failing it. --max-time bounds
        # each attempt and this bounds the whole step.
        timeout-minutes: 3
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 3 \
              http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak answered on attempt $i."
              exit 0
            fi
            if ! docker ps --filter name=keycloak --filter status=running -q | grep -q .; then
              echo "The Keycloak container is no longer running."
              docker logs keycloak
              exit 1
            fi
            echo "attempt $i: not yet"
            sleep 2
          done
          echo "Keycloak never came up."
          docker logs keycloak
          exit 1

      # No version here: global.json pins it, so CI and a developer's machine
      # cannot drift onto different SDKs without that being a visible change.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Release, because Debug and Release differ in what the optimiser and the
      # overflow checks do, and Release is what ships.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No LogFileName: every project would write to that one name and
      # overwrite the previous project's results, leaving an artifact that
      # reports one assembly and a skip guard that can only see one assembly.
      # The default name is unique per run.
      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --logger trx
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      # The integration suites skip themselves when their dependency is not
      # reachable, which is right on a developer's machine and wrong here: a
      # broker or a Keycloak that failed to start would leave the job green
      # with the tests that matter never having run. So CI refuses a skip.
      - name: Refuse a silent skip
        if: always()
        run: |
          shopt -s nullglob
          files=(artifacts/test-results/*.trx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test results were produced."
            exit 1
          fi
          # total minus executed, not the trx's own notExecuted: a test the
          # runner skipped leaves notExecuted at zero and only shows up as the
          # gap between those two. Verified against a run with a deliberately
          # absent broker, which is the only way to know a guard like this works.
          skipped=$(grep -ho '<Counters total="[0-9]*" executed="[0-9]*"' "${files[@]}" \
            | sed -E 's/.*total="([0-9]+)" executed="([0-9]+)".*/\1 \2/' \
            | awk '{ t += $1; e += $2 } END { printf "%d", t - e }')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "A test was skipped. In CI every dependency is present, so a skip is a failure."
            exit 1
          fi

      - name: Upload test results
        # Results matter most precisely when the run failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      # Separate job on purpose: a formatting slip should not hide a failing
      # test, and a red test should not be blamed on whitespace.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn
