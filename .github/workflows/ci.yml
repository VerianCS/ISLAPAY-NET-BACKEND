name: CI

# Every branch and every pull request. A payments backend with tests nobody
# runs is a payments backend without tests.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch, except on master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real broker, because the messaging tests are integration tests on
    # purpose: what is worth checking is that RabbitMQ accepts the topology we
    # declare and routes what we publish, and a mock can only confirm we called
    # our own code. Without this the tests would skip — quietly, which is worse
    # than failing.
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RABBITMQ_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      # No version here: global.json pins it, so CI and a developer's machine
      # cannot drift onto different SDKs without that being a visible change.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Release, because Debug and Release differ in what the optimiser and the
      # overflow checks do, and Release is what ships.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory artifacts/test-results

      - name: Upload test results
        # Results matter most precisely when the run failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      # Separate job on purpose: a formatting slip should not hide a failing
      # test, and a red test should not be blamed on whitespace.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity warn
